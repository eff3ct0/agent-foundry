name: Template bootstrap E2E

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: template-bootstrap-e2e-${{ github.repository }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out trusted harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate harness
        run: |
          python3 scripts/bootstrap-e2e.py --self-check
          python3 scripts/report-bootstrap-failure.py --self-check
      - name: Build recipe matrix
        id: matrix
        run: printf 'matrix=%s\n' "$(python3 scripts/bootstrap-e2e.py matrix)" >> "$GITHUB_OUTPUT"

  bootstrap:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Check out trusted harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Mint lifecycle app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.BOOTSTRAP_E2E_APP_ID }}
          private-key: ${{ secrets.BOOTSTRAP_E2E_PRIVATE_KEY }}
          owner: ${{ vars.BOOTSTRAP_E2E_OWNER }}
          permission-administration: write
          permission-contents: write
      - name: Run template bootstrap
        env:
          BOOTSTRAP_E2E_OWNER: ${{ vars.BOOTSTRAP_E2E_OWNER }}
          BOOTSTRAP_E2E_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          STACK: ${{ matrix.stack }}
          RUN_ID: ${{ github.run_id }}
          EVIDENCE_PATH: evidence/${{ matrix.stack }}.json
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p evidence
          python3 scripts/bootstrap-e2e.py template \
            --template "$REPOSITORY" \
            --stack "$STACK" \
            --run-id "$RUN_ID" \
            --evidence "$EVIDENCE_PATH" \
            --workflow-url "$WORKFLOW_URL"
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: template-bootstrap-e2e-${{ github.run_id }}-${{ matrix.stack }}
          path: evidence/${{ matrix.stack }}.json
          if-no-files-found: error
          retention-days: 7

  cleanup:
    if: always()
    needs: [prepare, bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out trusted cleanup helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download provisioning evidence
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: template-bootstrap-e2e-${{ github.run_id }}-*
          path: evidence
          merge-multiple: true
          if-no-artifact-found: warn
      - name: Mint lifecycle app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.BOOTSTRAP_E2E_APP_ID }}
          private-key: ${{ secrets.BOOTSTRAP_E2E_PRIVATE_KEY }}
          owner: ${{ vars.BOOTSTRAP_E2E_OWNER }}
          permission-administration: write
          permission-contents: write
      - name: Delete this run's independently verified repositories
        if: always()
        env:
          BOOTSTRAP_E2E_TOKEN: ${{ steps.app-token.outputs.token }}
          BOOTSTRAP_E2E_OWNER: ${{ vars.BOOTSTRAP_E2E_OWNER }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p cleanup
          python3 scripts/bootstrap-e2e.py cleanup-template \
            --template "$REPOSITORY" \
            --owner "$BOOTSTRAP_E2E_OWNER" \
            --run-id "$RUN_ID" \
            --evidence-dir evidence \
            --output cleanup/cleanup.json
      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: template-bootstrap-cleanup-${{ github.run_id }}
          path: cleanup/cleanup.json
          if-no-files-found: error
          retention-days: 7

  report:
    if: always()
    needs: [prepare, bootstrap, cleanup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out trusted reporter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download redacted evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: template-bootstrap-e2e-${{ github.run_id }}-*
          path: evidence
          merge-multiple: true
          if-no-artifact-found: warn
      - name: Report one canonical failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREPARE_STATUS: ${{ needs.prepare.result }}
          BOOTSTRAP_STATUS: ${{ needs.bootstrap.result }}
          CLEANUP_STATUS: ${{ needs.cleanup.result }}
        run: |
          python3 scripts/report-bootstrap-failure.py report \
            --template-e2e \
            --repository "$REPOSITORY" \
            --tag main \
            --workflow-url "$WORKFLOW_URL" \
            --artifact-url "$WORKFLOW_URL" \
            --evidence-dir evidence \
            --run-id "$RUN_ID" \
            --prepare-status "$PREPARE_STATUS" \
            --bootstrap-status "$BOOTSTRAP_STATUS" \
            --cleanup-status "$CLEANUP_STATUS"
