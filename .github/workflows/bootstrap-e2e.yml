name: Release bootstrap E2E

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Published release tag to verify
        required: true
        type: string

permissions: {}

concurrency:
  group: bootstrap-e2e-${{ github.repository }}-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out trusted harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.0
      - name: Validate harness
        run: |
          node scripts/release-ref.mjs --self-check
          node scripts/check-bootstrap-workflow.mjs
          node scripts/report-bootstrap-failure.mjs --self-check
      - name: Resolve published release commit
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
          EXPECTED_SHA: ${{ github.event_name == 'release' && github.sha || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";
          import { createHostedLifecycleReadClient } from "./scripts/hosted-lifecycle-read-client.mjs";
          import { prepareRelease } from "./scripts/release-prepare.mjs";
          const client = createHostedLifecycleReadClient({ token: process.env.GITHUB_TOKEN, transport: ({ url, headers, signal }) => fetch(url, { headers, signal }) });
          const recipes = JSON.parse(await readFile("ci/recipes.json", "utf8"));
          const result = await prepareRelease({ client, repository: process.env.REPOSITORY, tag: process.env.TAG_NAME, expectedSha: process.env.EXPECTED_SHA, recipes });
          if (result.status !== "ok") throw new Error(`release preparation failed: ${result.code}`);
          await appendFile(process.env.GITHUB_OUTPUT, `tag=${result.release.tag}\nsha=${result.release.sha}\nmatrix=${JSON.stringify(result.matrix.recipes)}\n`);
          NODE
  bootstrap:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Check out trusted harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.0
      - name: Check out the immutable release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: release-source
          fetch-depth: 1
          persist-credentials: false
      - name: Activate pinned package toolchain
        working-directory: release-source
        run: |
          corepack enable
          COREPACK_DEFAULT_TO_LATEST=0 corepack install --global pnpm@12.4.2
          test "$(pnpm --version)" = "12.4.2"
      - name: Mint lifecycle app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.BOOTSTRAP_E2E_APP_ID }}
          private-key: ${{ secrets.BOOTSTRAP_E2E_PRIVATE_KEY }}
          owner: ${{ vars.BOOTSTRAP_E2E_OWNER }}
          permission-administration: write
          permission-contents: write
          permission-workflows: write
      - name: Provision and validate the exact release package
        env:
          BOOTSTRAP_E2E_OWNER: ${{ vars.BOOTSTRAP_E2E_OWNER }}
          BOOTSTRAP_E2E_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          STACK: ${{ matrix.stack }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p evidence
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { createHostedLifecycleMutationClient } from "./scripts/typed-runtime/hosted-lifecycle-mutation-client.js";
          import { createHostedLifecycleReadClient } from "./scripts/hosted-lifecycle-read-client.mjs";
          import { matrixConfiguration } from "./scripts/local-matrix.mjs";
          import { provisionAndProve } from "./scripts/typed-runtime/resource-provision-and-proof.js";
          import { buildReleasePackage, runReleasedValidationCase } from "./scripts/released-validation-runner.mjs";
          import { validateModel } from "./scripts/triage-bootstrap-failure.mjs";
          const transport = ({ url, method = "GET", headers, body, signal }) => fetch(url, { method, headers, body, signal });
          const evidence = { schema_version: "bootstrap-e2e-failure/v1", source_repository: process.env.REPOSITORY, release_tag: process.env.RELEASE_TAG, release_sha: process.env.RELEASE_SHA, matrix_case: process.env.STACK, check_identifier: `bootstrap-e2e/${process.env.STACK}`, failure_code: "release_validation_failed", exit_code: 0, logs: [], result: "passed", cleanup_status: "not-attempted", openai_model: validateModel(process.env.OPENAI_MODEL) };
          try {
            const proofPath = `evidence/${process.env.STACK}.proof.json`;
            const mutationClient = createHostedLifecycleMutationClient({ token: process.env.BOOTSTRAP_E2E_TOKEN, transport });
            const proofClient = createHostedLifecycleReadClient({ token: process.env.BOOTSTRAP_E2E_TOKEN, transport });
            const provisioned = await provisionAndProve({ mutationClient, proofClient, proofStore: { write: (value) => writeFile(proofPath, value), read: () => readFile(proofPath, "utf8") }, runId: process.env.RUN_ID, owner: process.env.BOOTSTRAP_E2E_OWNER, resource: process.env.STACK, template: process.env.REPOSITORY, releaseSha: process.env.RELEASE_SHA });
            if (provisioned.status !== "verified") throw new Error(provisioned.code);
            const matrixCase = { ci: process.env.STACK, task: "github-issues", secrets: "none", intelligence: "codegraph", agent: "opencode" };
            const releasePackage = await buildReleasePackage({ sourcePath: "release-source", releaseSha: process.env.RELEASE_SHA, outputDirectory: "release-artifacts" });
            await runReleasedValidationCase({ releasePackage, matrixCase, configuration: matrixConfiguration(matrixCase), outputDirectory: "evidence" });
          } catch (error) {
            await writeFile(`evidence/${process.env.STACK}.json`, `${JSON.stringify({ ...evidence, result: "failed", exit_code: 1, logs: ["Node release validation failed"] })}\n`);
            throw error;
          }
          await writeFile(`evidence/${process.env.STACK}.json`, `${JSON.stringify(evidence)}\n`);
          NODE
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootstrap-e2e-${{ github.run_id }}-${{ matrix.stack }}
          path: evidence/${{ matrix.stack }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload detailed release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootstrap-e2e-release-evidence-${{ github.run_id }}-${{ matrix.stack }}
          path: evidence/**/release-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload provisioning proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootstrap-e2e-proof-${{ github.run_id }}-${{ matrix.stack }}
          path: evidence/${{ matrix.stack }}.proof.json
          if-no-files-found: warn
          retention-days: 7

  cleanup:
    if: always()
    needs: [prepare, bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Check out trusted cleanup harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.0
      - name: Mint lifecycle app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.BOOTSTRAP_E2E_APP_ID }}
          private-key: ${{ secrets.BOOTSTRAP_E2E_PRIVATE_KEY }}
          owner: ${{ vars.BOOTSTRAP_E2E_OWNER }}
          permission-administration: write
          permission-contents: write
      - name: Download this case's provisioning proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bootstrap-e2e-proof-${{ github.run_id }}-${{ matrix.stack }}
          path: evidence
          if-no-artifact-found: warn
      - name: Delete this run's proof-bound disposable repository
        if: always()
        env:
          BOOTSTRAP_E2E_TOKEN: ${{ steps.app-token.outputs.token }}
          BOOTSTRAP_E2E_OWNER: ${{ vars.BOOTSTRAP_E2E_OWNER }}
          RUN_ID: ${{ github.run_id }}
          STACK: ${{ matrix.stack }}
        run: |
          mkdir -p cleanup
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { createHostedLifecycleMutationClient } from "./scripts/typed-runtime/hosted-lifecycle-mutation-client.js";
          import { createHostedLifecycleReadClient } from "./scripts/hosted-lifecycle-read-client.mjs";
          import { cleanupProvisionedResource } from "./scripts/typed-runtime/resource-proof-cleanup.js";
          const transport = ({ url, method = "GET", headers, body, signal }) => fetch(url, { method, headers, body, signal });
          const token = process.env.BOOTSTRAP_E2E_TOKEN;
          const result = await cleanupProvisionedResource({ evidence: { download: () => readFile(`evidence/${process.env.STACK}.proof.json`, "utf8") }, artifact: { write: (value) => writeFile(`cleanup/${process.env.STACK}.json`, value) }, readClient: createHostedLifecycleReadClient({ token, transport }), mutationClient: createHostedLifecycleMutationClient({ token, transport }), owner: process.env.BOOTSTRAP_E2E_OWNER, target: process.env.STACK, runId: process.env.RUN_ID });
          if (!['deleted', 'already-absent'].includes(result.status)) throw new Error(`cleanup failed: ${result.code}`);
          NODE
      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootstrap-e2e-cleanup-${{ github.run_id }}-${{ matrix.stack }}
          path: cleanup/${{ matrix.stack }}.json
          if-no-files-found: error
          retention-days: 7

  triage:
    if: always()
    needs: [prepare, bootstrap, cleanup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out trusted triage helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.0
      - name: Download redacted evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bootstrap-e2e-${{ github.run_id }}-*
          path: evidence
          merge-multiple: true
          if-no-artifact-found: warn
      - name: Ask for bounded advisory triage
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          PREPARE_STATUS: ${{ needs.prepare.result }}
          BOOTSTRAP_STATUS: ${{ needs.bootstrap.result }}
          CLEANUP_STATUS: ${{ needs.cleanup.result }}
        run: |
          mkdir -p triage
          env -i "PATH=$PATH" "OPENAI_API_KEY=$OPENAI_API_KEY" "OPENAI_MODEL=$OPENAI_MODEL" node scripts/triage-bootstrap-failure.mjs \
            --evidence-dir evidence \
            --output triage/triage.json \
            --repository "$REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --run-id "$RUN_ID" \
            --prepare-status "$PREPARE_STATUS" \
            --bootstrap-status "$BOOTSTRAP_STATUS" \
            --cleanup-status "$CLEANUP_STATUS"
      - name: Upload bounded triage result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootstrap-e2e-triage-${{ github.run_id }}
          path: triage/triage.json
          if-no-files-found: error
          retention-days: 7

  report:
    if: always()
    needs: [prepare, bootstrap, cleanup, triage]
    runs-on: ubuntu-latest
    concurrency:
      group: bootstrap-e2e-report-${{ github.repository }}-${{ needs.prepare.outputs.sha || github.event.release.tag_name || inputs.tag_name || github.run_id }}
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out trusted reporter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.0
      - name: Download redacted evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bootstrap-e2e-${{ github.run_id }}-*
          path: evidence
          merge-multiple: true
          if-no-artifact-found: warn
      - name: Download bounded triage result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bootstrap-e2e-triage-${{ github.run_id }}
          path: triage
          if-no-artifact-found: warn
      - name: Report one canonical failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREPARE_STATUS: ${{ needs.prepare.result }}
          BOOTSTRAP_STATUS: ${{ needs.bootstrap.result }}
          CLEANUP_STATUS: ${{ needs.cleanup.result }}
        run: |
          node scripts/report-bootstrap-failure.mjs report \
            --repository "$REPOSITORY" \
            --workflow-url "$WORKFLOW_URL" \
            --artifact-url "$ARTIFACT_URL" \
            --evidence-dir evidence \
            --run-id "$RUN_ID" \
            --prepare-status "$PREPARE_STATUS" \
            --bootstrap-status "$BOOTSTRAP_STATUS" \
            --cleanup-status "$CLEANUP_STATUS" \
            --triage-file triage/triage.json
