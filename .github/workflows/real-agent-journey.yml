name: Real-agent user journey

on:
  release:
    types: [published]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      runtime:
        description: Select the supported runtime to execute
        required: true
        type: choice
        options:
          - codex-cli
      package_version:
        description: Exact published @eff3ct/agent-foundry version to execute
        required: true
        type: string

permissions: {}

concurrency:
  group: real-agent-journey-${{ github.repository }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  JOURNEY_RUN_ID: ${{ github.run_id }}
  JOURNEY_TEMPLATE: eff3ct0/agent-foundry
  JOURNEY_OWNER: ${{ vars.BOOTSTRAP_E2E_OWNER }}
  JOURNEY_RUNTIME: ${{ inputs.runtime || 'codex-cli' }}
  JOURNEY_PACKAGE_NAME: '@eff3ct/agent-foundry'
  JOURNEY_PACKAGE_VERSION: ${{ inputs.package_version || vars.REAL_AGENT_PACKAGE_VERSION || '' }}
  JOURNEY_CONTRACT_VERSION: real-agent-journey/v1
  JOURNEY_REPOSITORY: ${{ vars.BOOTSTRAP_E2E_OWNER && format('{0}/real-agent-journey-{1}', vars.BOOTSTRAP_E2E_OWNER, github.run_id) || '' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      repository: ${{ steps.plan.outputs.repository }}
      source_sha: ${{ steps.source.outputs.sha }}
      source_tag: ${{ steps.source.outputs.tag }}
      package_version: ${{ steps.source.outputs.package_version }}
    steps:
      - name: Check out trusted journey contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate parent contract
        run: |
          node scripts/real-agent-journey.mjs --self-check
          node scripts/real-agent-journey-provision.mjs --self-check
          node scripts/real-agent-journey-agent.mjs --self-check
          node scripts/real-agent-journey-assert.mjs --self-check
          node scripts/real-agent-journey-cleanup.mjs --self-check
      - name: Resolve immutable source revision
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_TAG: ${{ github.event.release.tag_name || '' }}
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ github.event_name == 'release' && github.sha || '' }}
          PACKAGE_VERSION: ${{ env.JOURNEY_PACKAGE_VERSION }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            resolved="$(node scripts/release-resolve.mjs --repository "$REPOSITORY" --tag "$SOURCE_TAG")"
            source_sha="${resolved#sha=}"
            source_tag="$SOURCE_TAG"
          else
            source_sha="$SOURCE_SHA"
            source_tag=""
          fi
          package_version="$PACKAGE_VERSION"
          if [ -n "$source_tag" ]; then package_version="${source_tag#v}"; fi
          node -e 'if (!/^[0-9a-f]{40}$/.test(process.argv[1])) throw new Error("source SHA must be a full lowercase SHA")' "$source_sha"
          node -e 'if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(process.argv[1])) throw new Error("package version must be exact")' "$package_version"
          printf 'sha=%s\ntag=%s\npackage_version=%s\n' "$source_sha" "$source_tag" "$package_version" >> "$GITHUB_OUTPUT"
      - name: Write run plan
        id: plan
        env:
          RUN_ID: ${{ env.JOURNEY_RUN_ID }}
          TEMPLATE: ${{ env.JOURNEY_TEMPLATE }}
          OWNER: ${{ env.JOURNEY_OWNER }}
          RUNTIME: ${{ env.JOURNEY_RUNTIME }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.source.outputs.package_version }}
        run: |
          test -n "$OWNER" || { printf 'BOOTSTRAP_E2E_OWNER is missing\n' >&2; exit 1; }
          mkdir -p journey
           args=(plan --run-id "$RUN_ID" --template "$TEMPLATE" --owner "$OWNER" --runtime "$RUNTIME" --source-sha "$SOURCE_SHA" --package-name '@eff3ct/agent-foundry' --package-version "$PACKAGE_VERSION" --output journey/contract.json)
          if [ -n "$SOURCE_TAG" ]; then args+=(--source-tag "$SOURCE_TAG"); fi
          node scripts/real-agent-journey.mjs "${args[@]}"
          printf 'repository=%s\n' "$JOURNEY_REPOSITORY" >> "$GITHUB_OUTPUT"
      - name: Upload run plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-agent-journey-${{ github.run_id }}-plan
          path: journey/contract.json
          if-no-files-found: error
          retention-days: 7

  provision:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out trusted journey contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Mint provisioning token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.BOOTSTRAP_E2E_APP_ID }}
          private-key: ${{ secrets.BOOTSTRAP_E2E_PRIVATE_KEY }}
          owner: ${{ env.JOURNEY_OWNER }}
          permission-administration: write
          permission-contents: write
      - name: Run provisioning adapter
        env:
          JOURNEY_TOKEN: ${{ steps.app-token.outputs.token }}
          JOURNEY_OUTPUT: stage/provision.json
        run: |
          mkdir -p stage
           node scripts/real-agent-journey-provision.mjs \
            --template "$JOURNEY_TEMPLATE" --owner "$JOURNEY_OWNER" \
            --run-id "$JOURNEY_RUN_ID" --expected-source-sha "${{ needs.prepare.outputs.source_sha }}" \
            --output "$JOURNEY_OUTPUT"
      - name: Upload provisioning evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-agent-journey-${{ github.run_id }}-provision
          path: stage/provision.json
          if-no-files-found: warn
          retention-days: 7

  agent:
    needs: [prepare, provision]
    if: needs.provision.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out trusted journey contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download provisioning evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: real-agent-journey-${{ github.run_id }}-provision
          path: stage-input
          if-no-artifact-found: error
      - name: Read generated default branch
        id: provision
        run: |
           branch=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("stage-input/provision.json", "utf8")).identifiers.default_branch)')
          case "$branch" in
            [A-Za-z0-9._/-]*) printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT" ;;
            *) printf 'generated default branch is invalid\n' >&2; exit 1 ;;
          esac
      - name: Mint agent token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.BOOTSTRAP_E2E_APP_ID }}
          private-key: ${{ secrets.BOOTSTRAP_E2E_PRIVATE_KEY }}
          owner: ${{ env.JOURNEY_OWNER }}
          permission-contents: write
          permission-issues: write
      - name: Create initial branch and apply the exact published creator package
        env:
          JOURNEY_TOKEN: ${{ steps.app-token.outputs.token }}
          JOURNEY_PACKAGE_SPEC: ${{ env.JOURNEY_PACKAGE_NAME }}@${{ needs.prepare.outputs.package_version }}
          JOURNEY_REPOSITORY: ${{ needs.prepare.outputs.repository }}
          JOURNEY_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          mkdir generated
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { deterministicConfiguration } from "./scripts/package-consumer-verify.mjs";
          await writeFile("answers.json", `${JSON.stringify(deterministicConfiguration, null, 2)}\n`);
          NODE
          npm view "$JOURNEY_PACKAGE_SPEC" --json > package-metadata.json
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const metadata = JSON.parse(await readFile("package-metadata.json", "utf8"));
          const name = "@eff3ct/agent-foundry";
          const spec = process.env.JOURNEY_PACKAGE_SPEC ?? "";
          const version = spec.slice(`${name}@`.length);
          const identifier = "(?:0|[1-9]\\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)";
          const semver = new RegExp(`^(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)(?:-${identifier}(?:\\.${identifier})*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$`);
          if (process.env.JOURNEY_PACKAGE_NAME !== name || spec !== `${name}@${version}` || !semver.test(version)) throw new Error("journey package spec must identify the exact scoped package and version");
          if (metadata.name !== name || metadata.version !== version) throw new Error("published package metadata does not match the exact journey package");
          await writeFile("generated/.journey-source.json", `${JSON.stringify({ source_sha: process.env.JOURNEY_SOURCE_SHA, package_name: name, package_version: version, package_spec: process.env.JOURNEY_PACKAGE_SPEC }, null, 2)}\n`);
          NODE
          npx --yes --package "$JOURNEY_PACKAGE_SPEC" foundry apply --target generated --config answers.json --non-interactive --yes
          git -C generated init -b main
          git -C generated config user.name "real-agent-journey"
          git -C generated config user.email "real-agent-journey@users.noreply.github.com"
          git -C generated add -A
          git -C generated commit -m "chore: initialize with Agent Foundry"
          git -C generated remote add origin "https://github.com/$JOURNEY_REPOSITORY.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: bearer $JOURNEY_TOKEN"
          git -C generated push origin HEAD:main
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
      - name: Install selected runtime
        run: node scripts/real-agent-journey.mjs install --runtime "$JOURNEY_RUNTIME"
      - name: Run cold-agent adapter
        env:
          JOURNEY_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.REAL_AGENT_JOURNEY_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          JOURNEY_OUTPUT: stage/agent.json
        run: |
          mkdir -p stage
          env -i "PATH=$PATH" "HOME=$HOME" "LANG=$LANG" \
            JOURNEY_RUN_ID="$JOURNEY_RUN_ID" JOURNEY_REPOSITORY="${{ needs.prepare.outputs.repository }}" \
            JOURNEY_RUNTIME="$JOURNEY_RUNTIME" JOURNEY_TOKEN="$JOURNEY_TOKEN" \
            OPENAI_API_KEY="$OPENAI_API_KEY" OPENAI_MODEL="$OPENAI_MODEL" \
             node scripts/real-agent-journey.mjs invoke-agent --runtime "$JOURNEY_RUNTIME" -- \
              --repository "${{ needs.prepare.outputs.repository }}" --run-id "$JOURNEY_RUN_ID" \
              --runtime "$JOURNEY_RUNTIME" --provision stage-input/provision.json \
               --workspace generated --decisions scripts/real-agent-decisions.json --output "$JOURNEY_OUTPUT" \
               --source-identity generated/.journey-source.json --package-name "$JOURNEY_PACKAGE_NAME" \
               --package-version "${{ needs.prepare.outputs.package_version }}"
      - name: Upload agent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-agent-journey-${{ github.run_id }}-agent
          path: stage/agent.json
          if-no-files-found: warn
          retention-days: 7

  assert:
    needs: [prepare, agent]
    if: needs.agent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - name: Check out trusted journey contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download agent evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: real-agent-journey-${{ github.run_id }}-agent
          path: stage-input
          if-no-artifact-found: error
      - name: Download provisioning evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: real-agent-journey-${{ github.run_id }}-provision
          path: provision-input
          if-no-artifact-found: error
      - name: Read implementation branch
        id: metadata
        env:
          AGENT_EVIDENCE: stage-input/agent.json
        run: |
           branch=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.AGENT_EVIDENCE, "utf8")).identifiers.branch)')
          case "$branch" in
            feature/[0-9]*-[a-z0-9-]*) printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT" ;;
            *) printf 'agent branch is invalid\n' >&2; exit 1 ;;
          esac
      - name: Mint readback token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.BOOTSTRAP_E2E_APP_ID }}
          private-key: ${{ secrets.BOOTSTRAP_E2E_PRIVATE_KEY }}
          owner: ${{ env.JOURNEY_OWNER }}
          permission-actions: read
          permission-contents: read
          permission-issues: read
      - name: Check out generated implementation
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.metadata.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
          path: generated
      - name: Run independent assertion adapter
        env:
          JOURNEY_TOKEN: ${{ steps.app-token.outputs.token }}
          JOURNEY_READ_TOKEN: ${{ steps.app-token.outputs.token }}
          JOURNEY_OUTPUT: stage/assert.json
        run: |
          mkdir -p stage
             node scripts/real-agent-journey-assert.mjs \
             --repository "${{ needs.prepare.outputs.repository }}" --run-id "$JOURNEY_RUN_ID" \
             --agent stage-input/agent.json --provision provision-input/provision.json --workspace generated \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --artifact-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output "$JOURNEY_OUTPUT"
      - name: Upload assertion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-agent-journey-${{ github.run_id }}-assert
          path: stage/assert.json
          if-no-files-found: warn
          retention-days: 7

  cleanup:
    if: always()
    needs: [prepare, provision, agent, assert]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out trusted journey contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Mint cleanup token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.BOOTSTRAP_E2E_APP_ID }}
          private-key: ${{ secrets.BOOTSTRAP_E2E_PRIVATE_KEY }}
          owner: ${{ env.JOURNEY_OWNER }}
          permission-administration: write
          permission-contents: write
      - name: Run exact cleanup adapter
        if: always()
        env:
          JOURNEY_TOKEN: ${{ steps.app-token.outputs.token }}
          JOURNEY_OUTPUT: stage/cleanup.json
        run: |
          mkdir -p stage
           node scripts/real-agent-journey-cleanup.mjs \
            --template "$JOURNEY_TEMPLATE" --owner "$JOURNEY_OWNER" --run-id "$JOURNEY_RUN_ID" \
            --output "$JOURNEY_OUTPUT"
      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-agent-journey-${{ github.run_id }}-cleanup
          path: stage/cleanup.json
          if-no-files-found: warn
          retention-days: 7

  report:
    if: always()
    needs: [prepare, provision, agent, assert, cleanup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out trusted journey contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download stage evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: real-agent-journey-${{ github.run_id }}-*
          path: stage
          merge-multiple: true
          if-no-artifact-found: warn
      - name: Aggregate bounded journey evidence
        env:
          JOURNEY_REPOSITORY: ${{ needs.prepare.outputs.repository || (vars.BOOTSTRAP_E2E_OWNER && format('{0}/real-agent-journey-{1}', vars.BOOTSTRAP_E2E_OWNER, github.run_id)) || '' }}
          JOURNEY_RUNTIME: ${{ env.JOURNEY_RUNTIME }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p evidence
           node scripts/real-agent-journey.mjs collect \
            --run-id "$JOURNEY_RUN_ID" --repository "$JOURNEY_REPOSITORY" \
            --runtime "$JOURNEY_RUNTIME" \
            --stage-dir stage --workflow-url "$WORKFLOW_URL" --output evidence/journey.json
      - name: Upload bounded journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-agent-journey-${{ github.run_id }}-evidence
          path: evidence/journey.json
          if-no-files-found: error
          retention-days: 7
      - name: Report canonical journey failure
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
           node scripts/real-agent-journey.mjs report \
            --input evidence/journey.json --repository "$JOURNEY_TEMPLATE" \
            --artifact-url "$WORKFLOW_URL"
