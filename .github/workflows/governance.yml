name: PR governance

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    # Keep this job name stable: main branch protection requires the "validate" check.
    name: validate
    runs-on: ubuntu-latest
    steps:
      # Keep the workflow definition trusted while validating the merge candidate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Validate PR metadata
        run: python3 scripts/check-pr-governance.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
