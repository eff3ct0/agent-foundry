name: PR governance

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    # Keep this job name stable: main branch protection requires the "validate" check.
    name: validate
    runs-on: ubuntu-latest
    steps:
      # Run the validator from the trusted base revision; PR files are metadata only.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
      - name: Validate PR metadata
        run: |
          if [ -f scripts/check-pr-governance.mjs ]; then
            node scripts/check-pr-governance.mjs
          elif [ -f scripts/check-pr-governance.py ]; then
            python3 scripts/check-pr-governance.py
          else
            echo "::error::No PR governance validator is available"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
