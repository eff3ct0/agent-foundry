name: Immutable npm release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Published release tag to publish and read back
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-release-${{ github.repository }}-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out trusted release contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.0
          registry-url: https://registry.npmjs.org
      - name: Resolve immutable release identity
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";
          import { createHostedLifecycleReadClient } from "./scripts/hosted-lifecycle-read-client.mjs";
          import { resolveReleaseForPublish } from "./scripts/release-readback.mjs";
          import { validateReleaseIdentity } from "./scripts/npm-release.mjs";
          const client = createHostedLifecycleReadClient({ token: process.env.GITHUB_TOKEN, transport: ({ url, headers, signal }) => fetch(url, { headers, signal }) });
          const release = await resolveReleaseForPublish({ client: { get: (endpoint) => client.get(endpoint) }, repository: process.env.REPOSITORY, tag: process.env.TAG_NAME, eventName: process.env.EVENT_NAME, eventSha: process.env.EVENT_SHA });
          if (release.status !== "ok") throw new Error(`release identity could not be verified: ${release.code}`);
          const version = process.env.TAG_NAME.replace(/^v/u, "");
          validateReleaseIdentity(process.env.TAG_NAME, version, release.sha);
          await appendFile(process.env.GITHUB_OUTPUT, `tag=${process.env.TAG_NAME}\nsha=${release.sha}\nversion=${version}\n`);
          NODE
      - name: Check out the exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: release-source
      - name: Activate pinned pnpm
        working-directory: release-source
        run: |
          test "$(node --version)" = "v20.19.0"
          npm install --global pnpm@12.4.2
          test "$(pnpm --version)" = "12.4.2"
      - name: Build and pack both exact packages once
        working-directory: release-source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p package local-package identity registry-package
          pnpm pack --ignore-scripts --pack-destination package
          test "$(find package -maxdepth 1 -name '*.tgz' -type f | wc -l)" = "1"
          # Keep the leading ./ : npm reads a bare dir/file.tgz argument as a GitHub owner/repo shorthand, not a local tarball.
          TARBALL="./$(find package -maxdepth 1 -name '*.tgz' -type f -print -quit)"
          tar -xzf "$TARBALL" --strip-components=1 -C local-package
          node scripts/npm-release.mjs --command verify-local --package-root local-package --tarball "$TARBALL" --tag "$RELEASE_TAG" --source-sha "$RELEASE_SHA" --output identity/local.json
          printf 'TARBALL=%s\n' "$TARBALL" >> "$GITHUB_ENV"
          # Historical tags without the initializer are not eligible for this dual-package release.
          test -f initializer/package.json
          npm pack ./initializer --ignore-scripts --pack-destination package
          test "$(find package -maxdepth 1 -name '*.tgz' -type f | wc -l)" = "2"
          INITIALIZER_TARBALL="./$(find package -maxdepth 1 -name '*create-agent-foundry*.tgz' -type f -print -quit)"
          test -f "$INITIALIZER_TARBALL"
          mkdir -p local-initializer
          tar -xzf "$INITIALIZER_TARBALL" --strip-components=1 -C local-initializer
          node scripts/npm-release.mjs --command verify-local --package-name @eff3ct/create-agent-foundry --package-root local-initializer --tarball "$INITIALIZER_TARBALL" --tag "$RELEASE_TAG" --source-sha "$RELEASE_SHA" --output identity/initializer.json
          printf 'INITIALIZER_TARBALL=%s\n' "$INITIALIZER_TARBALL" >> "$GITHUB_ENV"
      - name: Publish and read back the exact pair with npm provenance
        working-directory: release-source
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
          RUN_ID: ${{ github.run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node scripts/npm-release.mjs --command publish-pair
      - name: Upload immutable release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-release-${{ github.run_id }}
          path: release-source/identity/*.json
          if-no-files-found: error
          retention-days: 7
