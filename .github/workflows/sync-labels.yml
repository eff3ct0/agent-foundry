name: Sync GitHub labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - scripts/sync-github-labels.py

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize labels
        run: python3 scripts/sync-github-labels.py --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
