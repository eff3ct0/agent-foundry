name: Product task
description: Propose a product or template improvement
title: "[Task] "
labels:
  - type:product
body:
  - type: textarea
    id: context
    attributes:
      label: Context / problem
      description: What problem does this solve, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable criteria that prove the task is complete.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what is included and excluded.
      placeholder: |
        In: ...
        Out: ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Which commands or checks will verify the change?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Use the repository Definition of Done before closing the task.
